name: CI

# The assembly line from the session: every push is tested before it ships.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check no secret was committed
        run: |
          if grep -rIn --exclude-dir=.git --exclude=.env.example \
               -E "gsk_[A-Za-z0-9]{20,}" . ; then
            echo "A real-looking API key is in the repository. Revoke it now."
            exit 1
          fi
          echo "no committed secrets found"

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Check the service starts and answers
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "service is up"
              curl -s http://127.0.0.1:8000/api/health
              exit 0
            fi
          done
          echo "service did not come up in 20 seconds"
          exit 1
